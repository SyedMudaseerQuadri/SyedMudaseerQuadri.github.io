<!DOCTYPE html>
<html lang="en">

<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE SYSTEM — Syed's Life RPG</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700;800&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    /* ================= THE SYSTEM — modern 3D skin =================
       Depth comes from three things only: a lit top edge (inset highlight),
       a drop shadow below, and a hard "base" shadow on pressable things so
       they physically sink when tapped. Colour tokens keep their old names
       because the render code uses them inline. */
    :root {
      --ink: #07080D;
      --panel: #10131C;
      --panel2: #161A26;
      --line: rgba(255, 255, 255, .06);
      --line2: rgba(255, 255, 255, .11);
      --washi: #EEF0F6;
      --muted: #7F8699;
      --soft: #C4C9D6;
      --gold: #F2B84B;
      --gold-deep: #9C6A12;
      --vermilion: #FF5A4E;
      --green: #6FD39A;
      --blue: #6AA8FF;
      --violet: #9B7BFF;
      --chart-green: #5FA84E;
      --glass: linear-gradient(155deg, rgba(255, 255, 255, .075), rgba(255, 255, 255, .015) 55%);
      --lift: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 -1px 0 rgba(0, 0, 0, .4) inset,
              0 18px 40px -18px rgba(0, 0, 0, .9), 0 4px 10px -4px rgba(0, 0, 0, .6);
      --r: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--washi);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* slow-drifting light sources behind everything */
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 60vmax; height: 60vmax;
      border-radius: 50%;
      filter: blur(90px);
      opacity: .22;
      pointer-events: none;
      animation: drift 28s ease-in-out infinite alternate;
    }
    body::before { background: radial-gradient(circle, #F2B84B, transparent 65%); top: -25vmax; left: -15vmax; }
    body::after  { background: radial-gradient(circle, #7B5CFF, transparent 65%); bottom: -30vmax; right: -20vmax; animation-delay: -14s; }
    @keyframes drift { to { transform: translate(8vmax, 6vmax) scale(1.12); } }

    #app { max-width: 620px; margin: 0 auto; min-height: 100vh; }

    button { font-family: inherit; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, background .2s, color .2s, border-color .2s; }
    button:disabled { cursor: not-allowed; opacity: .5; }

    input, select, textarea {
      background: rgba(0, 0, 0, .35);
      border: 1px solid var(--line2);
      border-radius: 12px;
      color: var(--washi);
      padding: 11px 13px;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .45) inset;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(242, 184, 75, .6);
      box-shadow: 0 2px 6px rgba(0, 0, 0, .45) inset, 0 0 0 3px rgba(242, 184, 75, .14);
    }
    select option { background: #10131C; }

    /* ---------- header: a floating glass slab ---------- */
    .header {
      margin: 12px 12px 0;
      padding: 18px 18px 14px;
      background: var(--glass), rgba(16, 19, 28, .72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--line2);
      border-radius: 22px;
      box-shadow: var(--lift);
    }

    .seal {
      width: 56px; height: 56px;
      background: linear-gradient(145deg, #FF7A5C, #D6362B 60%, #8E1D15);
      color: #FFF3E6;
      font-family: 'Shippori Mincho', serif;
      font-weight: 800;
      font-size: 30px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 16px;
      transform: perspective(300px) rotateX(10deg) rotate(-5deg);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .35) inset, 0 6px 0 #6E150F, 0 14px 28px -6px rgba(255, 90, 78, .55);
      flex-shrink: 0;
      text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
    }

    .syslabel { font-size: 10px; letter-spacing: 3px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

    .pname { font-family: 'Space Grotesk', sans-serif; font-size: 21px; font-weight: 700; letter-spacing: .2px; }

    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gold); }

    /* ---------- progress: a recessed groove with a glowing bar ---------- */
    .track {
      height: 9px;
      background: rgba(0, 0, 0, .5);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 5px;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .8) inset, 0 1px 0 rgba(255, 255, 255, .04);
    }
    .fill {
      height: 100%;
      background: linear-gradient(90deg, #C98A1C, var(--gold), #FFE3A0);
      border-radius: 99px;
      box-shadow: 0 0 12px rgba(242, 184, 75, .55), 0 1px 0 rgba(255, 255, 255, .45) inset;
      transition: width .6s cubic-bezier(.2, .8, .2, 1);
    }

    .worktags { display: flex; justify-content: center; gap: 8px; margin: 2px 0 10px; flex-wrap: wrap; }
    .worktag {
      display: flex; flex-direction: column; align-items: center; min-width: 78px;
      padding: 6px 12px; border-radius: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
      border: 1px solid rgba(242, 184, 75, .25);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 4px 10px rgba(0, 0, 0, .35);
    }
    .worktag small { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
    .worktag b { font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--gold); }
    .hstats { display: flex; gap: 7px; margin-top: 14px; font-size: 12.5px; color: var(--soft); flex-wrap: wrap; }
    .hstats > span {
      padding: 5px 10px;
      background: rgba(255, 255, 255, .04);
      border: 1px solid var(--line);
      border-radius: 999px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset;
    }

    /* ---------- tabs: floating segmented pill ---------- */
    .tabs {
      display: flex;
      gap: 4px;
      position: sticky;
      top: 8px;
      z-index: 5;
      margin: 12px 12px 0;
      padding: 5px;
      background: rgba(12, 14, 21, .78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--line2);
      border-radius: 16px;
      box-shadow: var(--lift);
    }
    .tab {
      flex: 1;
      padding: 10px 2px;
      background: transparent;
      border: none;
      border-radius: 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .tab:hover { color: var(--soft); }
    .tab.on {
      color: #1A1204;
      background: linear-gradient(180deg, #FFD37A, var(--gold));
      box-shadow: 0 1px 0 rgba(255, 255, 255, .5) inset, 0 3px 0 var(--gold-deep), 0 8px 18px -6px rgba(242, 184, 75, .6);
      transform: translateY(-1px);
    }

    .wrap { padding: 16px 12px 90px; }
    .panel { display: none; }
    .panel.on { display: block; }
    .sub { display: none; }
    .sub.on { display: block; }

    /* ---------- cards: glass tiles that lift on hover ---------- */
    .card {
      display: flex;
      align-items: center;
      gap: 11px;
      background: var(--glass), var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 13px 14px;
      margin-bottom: 11px;
      box-shadow: var(--lift);
      transform: perspective(900px) translateZ(0);
      transition: transform .25s cubic-bezier(.2, .8, .2, 1), box-shadow .25s, border-color .25s;
    }
    @media (hover: hover) {
      .card:hover {
        transform: perspective(900px) translateY(-3px) rotateX(2deg);
        border-color: var(--line2);
        box-shadow: 0 1px 0 rgba(255, 255, 255, .1) inset, 0 -1px 0 rgba(0, 0, 0, .4) inset,
                    0 26px 50px -20px rgba(0, 0, 0, .95), 0 6px 14px -6px rgba(0, 0, 0, .7);
      }
    }
    .col { flex-direction: column; align-items: stretch; }

    /* ---------- checkbox: a physical key ---------- */
    .check {
      width: 28px; height: 28px;
      border-radius: 9px;
      border: 2px solid;
      color: #0B0D12;
      font-weight: 800;
      flex-shrink: 0;
      font-size: 14px;
      background: rgba(0, 0, 0, .35);
      box-shadow: 0 1px 0 rgba(255, 255, 255, .12) inset, 0 3px 0 rgba(0, 0, 0, .55);
    }
    .check:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .55); }

    .meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.55; }

    .del {
      background: none;
      border: 1px solid transparent;
      color: #5B6172;
      font-size: 14px;
      padding: 5px 7px;
      border-radius: 8px;
    }
    .del:hover { color: var(--washi); background: rgba(255, 255, 255, .06); border-color: var(--line); }

    /* ---------- buttons with a real base: they sink when pressed ---------- */
    .gold {
      background: linear-gradient(180deg, #FFD37A, var(--gold) 55%, #D99A2B);
      color: #1A1204;
      border: none;
      border-radius: 12px;
      padding: 11px 17px;
      font-weight: 700;
      font-size: 13.5px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .55) inset, 0 4px 0 var(--gold-deep), 0 10px 22px -8px rgba(242, 184, 75, .6);
    }
    .gold:hover { filter: brightness(1.06); }
    .gold:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(255, 255, 255, .4) inset, 0 1px 0 var(--gold-deep); }

    .ghost {
      background: linear-gradient(180deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
      border: 1px solid var(--line2);
      color: var(--soft);
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 13px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .07) inset, 0 3px 0 rgba(0, 0, 0, .5);
    }
    .ghost:hover { color: var(--washi); border-color: rgba(255, 255, 255, .2); }
    .ghost:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0, 0, 0, .5); }

    .section {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: var(--gold);
      margin: 8px 0 11px;
      text-shadow: 0 0 18px rgba(242, 184, 75, .35);
    }
    .section .meta { text-transform: none; letter-spacing: 0; text-shadow: none; display: inline; }

    .hint { font-size: 12.5px; color: var(--muted); margin-bottom: 13px; line-height: 1.6; }

    /* ---------- loot chest: a lit pedestal ---------- */
    .chest {
      margin-top: 18px;
      border: 1px solid var(--line2);
      border-radius: 20px;
      padding: 22px 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      text-align: center;
      background: radial-gradient(120% 80% at 50% 0%, rgba(242, 184, 75, .12), transparent 60%), var(--glass), var(--panel);
      box-shadow: var(--lift);
    }
    .chest > div:first-child { filter: drop-shadow(0 12px 14px rgba(0, 0, 0, .7)); }

    .row { display: flex; gap: 8px; }
    /* inputs share the row and shrink; buttons keep their size */
    .row > input, .row > select { flex: 1 1 0; min-width: 0; }
    .row > button { flex-shrink: 0; }
    select { text-overflow: ellipsis; padding-right: 8px; }

    .banner {
      background: linear-gradient(155deg, rgba(111, 211, 154, .14), rgba(111, 211, 154, .04));
      border: 1px solid rgba(111, 211, 154, .28);
      border-radius: 14px;
      padding: 13px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.55;
      color: #CDEFD9;
      box-shadow: var(--lift);
    }

    .badge { font-size: 11px; font-family: 'JetBrains Mono', monospace; padding: 3px 8px; border-radius: 7px; font-weight: 700; }

    .chip {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 90, 78, .15);
      color: #FF9B92;
      display: inline-block;
      margin-bottom: 5px;
      border: 1px solid rgba(255, 90, 78, .25);
    }

    .pipe { display: grid; grid-template-columns: repeat(auto-fit, minmax(66px, 1fr)); gap: 7px; }
    .pipecell {
      min-width: 0;
      background: rgba(0, 0, 0, .3);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 9px 4px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, .45) inset;
    }
    .pipenum { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 700; color: var(--gold); text-shadow: 0 0 14px rgba(242, 184, 75, .4); }
    .pipelbl { font-size: 10.5px; color: var(--muted); letter-spacing: .5px; margin: 3px 0 6px; }

    .mini {
      background: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .05));
      color: var(--washi);
      border: 1px solid var(--line2);
      border-radius: 7px;
      width: 27px; height: 25px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .5);
    }
    .mini:active { transform: translateY(2px); box-shadow: none; }

    /* ---------- focus timer: a glowing dial ---------- */
    .raid {
      border: 1px solid rgba(242, 184, 75, .22);
      background: radial-gradient(90% 70% at 50% 0%, rgba(242, 184, 75, .14), transparent 70%), var(--glass), var(--panel);
      border-radius: 22px;
      padding: 20px 16px;
      margin-bottom: 13px;
      text-align: center;
      box-shadow: var(--lift);
    }
    .raidclock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 44px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 2px;
      text-shadow: 0 0 24px rgba(242, 184, 75, .45), 0 3px 0 rgba(0, 0, 0, .6);
    }

    .deskhead { display: none; }

    /* ---------- quest cards + subtasks ---------- */
    .quest { position: relative; overflow: hidden; }
    .quest::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: var(--cat);
      box-shadow: 0 0 14px var(--cat);
    }
    .quest.is-done { opacity: .55; }
    .qrow { display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
    .qbody { flex: 1 1 150px; min-width: 0; }
    /* action buttons stay together and drop to their own line when the column is narrow */
    .qacts { display: flex; align-items: center; gap: 2px; margin-left: auto; flex-shrink: 0; }
    .qname { font-weight: 600; font-size: 14.5px; overflow-wrap: break-word; }

    .steps-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px !important;
      font-weight: 700;
      color: var(--soft) !important;
      background: rgba(255, 255, 255, .05) !important;
      border: 1px solid var(--line2) !important;
      min-width: 38px;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .45);
    }
    .steps-btn.on { color: #1A1204 !important; background: var(--gold) !important; border-color: var(--gold) !important; }

    .subbar {
      height: 5px;
      margin: 10px 0 0 39px;
      background: rgba(0, 0, 0, .45);
      border-radius: 99px;
      overflow: hidden;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .8) inset;
    }
    .subfill {
      height: 100%;
      background: linear-gradient(90deg, var(--cat), #fff);
      border-radius: 99px;
      box-shadow: 0 0 10px var(--cat);
      transition: width .45s cubic-bezier(.2, .8, .2, 1);
    }

    .subs { margin: 10px 0 0 59px; display: flex; flex-direction: column; gap: 6px; }

    /* ---------- drag handle: hold ⋮⋮ and drag to reorder quests ---------- */
    .grip {
      width: 14px; flex: 0 0 14px; margin-right: -5px;
      display: grid; place-items: center;
      color: #5B6172; font-size: 15px; letter-spacing: -3px; line-height: 1;
      cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
      padding: 8px 0;
    }
    .grip:hover { color: var(--washi); }
    .quest.dragging {
      z-index: 5; cursor: grabbing; transition: none !important;
      border-color: var(--gold) !important;
      box-shadow: 0 26px 50px -16px rgba(0, 0, 0, .95), 0 0 0 1px rgba(242, 184, 75, .35);
    }
    .quest.dragging .grip { cursor: grabbing; color: var(--gold); }
    .quest.shifting { transition: transform .18s cubic-bezier(.2, .8, .2, 1) !important; }
    body.qdragging, body.qdragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
    .subitem {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 9px;
      background: rgba(0, 0, 0, .25);
      border: 1px solid var(--line);
      border-radius: 11px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .03) inset;
    }
    .subitem.is-done .subname { text-decoration: line-through; color: var(--muted); }
    .subname { flex: 1; font-size: 13px; overflow-wrap: anywhere; }
    .subcheck {
      width: 20px; height: 20px;
      flex-shrink: 0;
      border-radius: 6px;
      border: 2px solid var(--cat);
      background: transparent;
      color: #0B0D12;
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .5);
    }
    .subcheck.on { background: var(--cat); }
    .subcheck:active { transform: translateY(2px); box-shadow: none; }
    .subadd { display: flex; gap: 7px; }
    .quest.planned { opacity: .85; border-style: dashed; }
    .plan-moon { width: 26px; text-align: center; font-size: 16px; flex: 0 0 26px; }
    .subnum {
      width: 20px; height: 20px; flex: 0 0 20px; border-radius: 6px;
      display: grid; place-items: center; font-size: 11px; font-weight: 700;
      color: var(--cat); border: 1px solid var(--cat); opacity: .8;
    }
    .subadd input { padding: 9px 11px; font-size: 13px; }
    .subadd .gold { padding: 8px 13px; font-size: 12.5px; }

    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(1.06); } }
    @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
    .pulse { animation: pulse 1.4s infinite; }
    .shake { animation: shake .3s infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, body::before, body::after { animation: none !important; transition: none !important; }
      .card:hover { transform: none !important; }
    }

    /* ============ DESKTOP: 12-column grid, each panel a glass column ============ */
    @media (min-width:1024px) {
      #app { max-width: 1600px; }
      .tabs { display: none; }
      .wrap {
        display: grid;
        grid-template-columns: repeat(12, 1fr);
        gap: 18px;
        padding: 18px 22px 60px;
        align-items: start;
      }
      .panel {
        display: block !important;
        padding: 14px;
        background: rgba(255, 255, 255, .018);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 30px 60px -30px rgba(0, 0, 0, .9);
      }
      .sub { display: block !important; }
      .sub-stats { margin-top: 6px; }
      .panel { min-width: 0; }
      /* two columns until there's room for four readable ones:
         quests + campaign on the left, pomodoro + rewards/stats on the right */
      .p-quests { grid-column: 1 / 7; grid-row: 1; }
      .p-campaign { grid-column: 1 / 7; grid-row: 2; }
      .p-pomodoro { grid-column: 7 / 13; grid-row: 1; }
      .p-side { grid-column: 7 / 13; grid-row: 2; display: flex; flex-direction: column; }
      .deskhead {
        display: block;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 11.5px;
        letter-spacing: 3px;
        color: var(--soft);
        padding: 4px 4px 12px;
        margin-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }
      .header { margin: 16px 22px 0; padding: 20px 24px 16px; }
    }
    @media (min-width:1440px) {
      .p-quests, .p-campaign, .p-pomodoro, .p-side { grid-column: span 3; grid-row: auto; }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <input type="file" id="dbFile" accept=".json" style="display:none">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script>
    // ================= CONFIG =================
    const CATS = {
      Editing: { color: "#E0703C", icon: "✂️" }, Design: { color: "#B48EDE", icon: "🎨" },
      Comms: { color: "#5E8FC9", icon: "💬" }, Language: { color: "#9AA7E0", icon: "🌐" },
      Body: { color: "#7FA36B", icon: "🤸" }, Guitar: { color: "#D4A947", icon: "🎸" },
      Lab: { color: "#5BB8A8", icon: "🧪" }, Work: { color: "#C97B9E", icon: "💼" },
    };
    const DIFF = { Easy: { xp: 10, min: 10 }, Medium: { xp: 25, min: 20 }, Hard: { xp: 50, min: 35 } };
    const BASE_CAP = 240;        // game: 4 hrs/day base
    const PHONE_CAP = 120;       // phone: 2 hrs/day, fixed
    const SMALL_BONUS = 0.01, BIG_BONUS = 0.25;
    const RAID_MIN = 45;         // focus timer length (minutes)
    const POMO_WORK = 45;        // pomodoro work cycle (minutes)

          // migration) would have setBase() read the grown total and quietly
          // devalue every bucket in it.
          if (!target.base) target.base = target.total;
          while (left > 0.0001 && guard++ < 120) {
            const room = target.total - target.done;
            if (room <= 0.0001) {
              if (target.total >= SET_MAX) break;      // never grow without end
              target.total++; grew++;
              continue;
            }
            const take = Math.min(room, left);
            target.done = Math.round((target.done + take) * 1000) / 1000;
            payMin += bucketMin(target) * take; payXp += bucketXp(target) * take;
            left -= take;
          }
          poured.push(target.name + " " + fmtBk(target.done) + "/" + target.total);
        }
        // Work with no set to pour into (none attached, or every set full) pays
        // like a one-bucket Easy set — the floor, never better than a real set.
        if (left > 0.0001) { payMin += rateMin(POMO_NOSET) * left; payXp += rateXp(POMO_NOSET) * left; }
        const bonus = Math.max(1, Math.round(payMin * mult));
        const xpGain = Math.max(1, Math.round(payXp * mult));
        S.bank += bonus; S.xp += xpGain; S.catXp[cat] = (S.catXp[cat] || 0) + xpGain;

        const modeTag = P.mode === "flowtime" ? "Flow session (" + worked + "m)" : "Pomodoro cycle";
        const pay = "+" + xpGain + " XP, +" + bonus + "m game time";
        let energyNote = "";
        if (flowStartedAt && P.mode === "flowtime") {
          const e = logFlowEnergy(flowStartedAt, worked);
          const nm = { m: "Morning", a: "Afternoon", e: "Evening" }[e.sl];
          energyNote = e.manual != null
            ? " Energy Map: " + nm + " keeps your manual " + e.manual + "/5."
            : " Energy Map: " + nm + " auto-set to " + e.score + "/5.";
        }
        const bonusNote = mult > 1 ? " Deep-focus bonus ×" + mult + "." : "";
        const grewNote = grew ? " Overtime: +" + grew + " bucket" + (grew > 1 ? "s" : "") +
          " grown on " + set.name + " (now " + set.total + ", still " + fmtM(bucketMin(set)) + "m each)." : "";
        const spillNote = left > 0.0001 ? " " + fmtBk(left) + " bucket of work had nowhere to go — this set hit the " + SET_MAX + "-bucket ceiling." : "";
        const capNote = capped ? " ⚠ Timer had run " + Math.round(capped / 60) + "h — capped at " + FLOW_MAX + "m. Stop the clock when you stop working." : "";

        if (poured.length) {
          pomoMsg = "🍅 " + modeTag + " complete — " + fmtBk(fill) + " bucket" + (fill >= 2 ? "s" : "") +
            " into " + poured.join(", then ") + " (1/" + setBase(set) + " of the " + diff + " rate per bucket): " + pay + "." + bonusNote + grewNote + spillNote + capNote + energyNote + " Break time.";
        } else {
          pomoMsg = "🍅 " + modeTag + " complete — no bucket set attached, so the " + POMO_NOSET +
            " rate applies: " + pay + "." + bonusNote + capNote + energyNote + " Break time.";
        }

        const sid = P.sid; P.sid = null;
        dbPut("pomodoro", { cid: sid ? "pomo-" + sid : undefined, ts: new Date().toISOString(), mode: P.mode || "pomodoro", worked, fill: Math.round(fill * 1000) / 1000, mult, capped: capped || null, set: set ? set.name : null, bucket: set ? fmtBk(set.done) + "/" + set.total : null, diff, cat, note: P.note || "", xp: xpGain, min: bonus });
        if (workByDay) { const wk = dayKey(shiftNow()); workByDay[wk] = (workByDay[wk] || 0) + worked; }
        logTx("pomodoro", modeTag + (set ? " — " + set.name : "") + " · " + fmtBk(fill) + " bucket · " + diff, { xp: xpGain, min: bonus, cat, note: P.note || "", worked, cid: sid ? "tx-pomo-" + sid : undefined });
        rollCard("your focus session");
        P.note = "";
        P.phase = "break";
        P.breakMin = pomoBreakMin(worked);
        if (autoBreak) { P.endsAt = Date.now() + P.breakMin * 60000; P.dev = DEVICE; }
      } else {
        P.phase = "work";
        P.breakMin = null;
        pomoMsg = "☕ Break over — start the next work cycle.";
      }
    }

    window.addEventListener("resize", () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; render(); });

    // ================= CLOUD SYNC (Supabase) =================
    // The browser copy stays the working copy: the app opens instantly and works
    // offline. Signed in, it pulls the newest cloud save on open and whenever the
    // app comes back into view, and pushes ~1.5s after every change.
    //   system_state — one row per user: the whole state, stamped with S._rev
    //   system_log   — one row per log record (transactions, tasks, pomodoro,
    //                  journal), deduped across devices by its cid
    // Both tables are locked to their owner by row level security
    // (see supabase-setup.sql), so the public key below is safe in the page.
    const SB_URL = "https://mbncpbuypmtalevnpicq.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ibmNwYnV5cG10YWxldm5waWNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNTY4NTYsImV4cCI6MjEwNzgzMjg1Nn0.7pNVwWj_Lr0fVSE-b3xwwdV43MHRYnSiEwl26zPFwo0";
    const sb = window.supabase ? window.supabase.createClient(SB_URL, SB_KEY) : null;
    const SYNC_REV = "lifesys-synced-rev", LOG_CURSOR = "lifesys-log-cursor";
    const LOG_STORES = ["transactions", "tasks", "pomodoro", "journal"];
    let cloudUser = null, cloudMsg = "", cloudBusy = false, lastSync = null, pushTimer = null, syncing = false, syncAgain = false;
    function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
    function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
    function newCid() { return window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2); }
    function localState() { try { return JSON.parse(lsGet(KEY) || "null"); } catch (e) { return null; } }
    // May this copy of the System finish a timer that ran out at endedAt?
    // The device that started it goes first; any other waits TAKEOVER_MS in case
    // that device is just asleep. Signed in, a sync that STARTED after the timer
    // ran out must land first, so a session another device already finished is
    // taken from the cloud instead of being logged a second time.
    const TAKEOVER_MS = 2 * 60000;
    let lastSyncTry = 0;
    function timerMayFinish(owner, endedAt) {
      if (owner && owner !== DEVICE && Date.now() < endedAt + TAKEOVER_MS) return false;
      if (!sb || !cloudUser || !navigator.onLine) return true;
      if (lastSyncTry >= endedAt) return true;
      if (syncing) syncAgain = true; else sync();
      return false;
    }
    function schedulePush() {
      if (!sb || !cloudUser) return;
      clearTimeout(pushTimer);
      pushTimer = setTimeout(() => { pushTimer = null; sync(); }, 1500);
    }
    async function sync() {
      if (!sb || !cloudUser) return;
      if (syncing) { syncAgain = true; return; }
      syncing = true;
      const started = Date.now();
      try {
        await syncState();
        const got = await pullLogs();
        await pushLogs();
        lastSync = new Date(); cloudMsg = "";
        if (got && S) loadWorkTotals();
      } catch (e) {
        cloudMsg = navigator.onLine ? "⚠ Sync failed: " + (e.message || e) : "Offline — changes will sync when you're back online.";
      }
      syncing = false; lastSyncTry = started;
      if (S) refreshCloudCard();
      if (syncAgain) { syncAgain = false; sync(); }
    }
    async function syncState() {
      const { data, error } = await sb.from("system_state").select("state").maybeSingle();
      if (error) throw error;
      const first = lsGet(SYNC_REV) == null, synced = +lsGet(SYNC_REV) || 0;
      const local = localState(), lrev = (local && local._rev) || 0;
      const remote = data && data.state, rrev = remote ? (remote._rev || 0) : -1;
      let take = false;
      if (rrev > synced) {
        // another device saved since this one last synced
        if (first && lrev) {
          take = confirm("Cloud save: " + (remote.xp || 0) + " XP, last changed " + new Date(rrev).toLocaleString() + ".\n" +
            "This device: " + (local.xp || 0) + " XP, last changed " + new Date(lrev).toLocaleString() + ".\n\n" +
            "OK = load the cloud save on this device (this device's data is replaced)\n" +
            "Cancel = keep this device's data and upload it to the cloud");
        } else take = !(lrev > synced && lrev > rrev);   // keep ours only if we changed it, and later
      }
      if (take) {
        lsSet(KEY, JSON.stringify(remote)); lsSet(SYNC_REV, String(rrev));
        if (S) { load(); render(true); }
        return;
      }
      if (local && (rrev < 0 || lrev > synced || first)) {
        const r = await sb.from("system_state").upsert({ user_id: cloudUser.id, state: local, updated_at: new Date().toISOString() });
        if (r.error) throw r.error;
        lsSet(SYNC_REV, String(lrev));
      }
    }
    async function pullLogs() {
      let cur = +lsGet(LOG_CURSOR) || 0, got = 0;
      const have = {};
      for (const st of LOG_STORES) have[st] = new Set((await dbGetAll(st)).map(r => r.cid).filter(Boolean));
      for (;;) {
        const { data, error } = await sb.from("system_log").select("id,store,cid,data").gt("id", cur).order("id").limit(1000);
        if (error) throw error;
        const fresh = {};
        data.forEach(r => {
          cur = Math.max(cur, r.id);
          if (!have[r.store] || have[r.store].has(r.cid)) return;
          have[r.store].add(r.cid);
          const row = Object.assign({}, r.data, { cid: r.cid, sy: 1 }); delete row.id;
          (fresh[r.store] = fresh[r.store] || []).push(row); got++;
        });
        for (const st in fresh) await dbPutMany(st, fresh[st]);
        lsSet(LOG_CURSOR, String(cur));
        if (data.length < 1000) break;
      }
      return got;
    }
    async function pushLogs() {
      for (const st of LOG_STORES) {
        const rows = (await dbGetAll(st)).filter(r => !r.sy);
        for (let i = 0; i < rows.length; i += 500) {
          const chunk = rows.slice(i, i + 500);
          chunk.forEach(r => { if (!r.cid) r.cid = newCid(); });
          const { error } = await sb.from("system_log").upsert(chunk.map(r => {
            const data = Object.assign({}, r); delete data.id; delete data.sy;
            return { user_id: cloudUser.id, store: st, cid: r.cid, data };
          }), { onConflict: "user_id,cid", ignoreDuplicates: true });
          if (error) throw error;
          chunk.forEach(r => { r.sy = 1; });
          await dbPutMany(st, chunk);
        }
      }
    }
    // Import and wipe replace the log history, so the cloud copy is cleared to match.
    async function cloudResetLogs() {
      const { error } = await sb.from("system_log").delete().eq("user_id", cloudUser.id);
      if (error) throw error;
      lsSet(LOG_CURSOR, "0");
    }
    function cloudCard() {
      const inner = !sb
        ? `<div class="meta">Cloud sync couldn't load (offline?). Changes save on this device and sync next time you're online.</div>`
        : `<div class="meta">Signed in as <b style="color:var(--washi)">${esc(cloudUser ? (cloudUser.email || "").replace(/@syedmudaseer\.com$/, "") : "")}</b>. This device syncs with your other devices automatically.${lastSync ? ` Last synced ${lastSync.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}.` : ""}</div>
      <div class="row">
        <button class="gold" style="flex:1" onclick="act.cloudSync()">Sync now</button>
        <button class="ghost" style="flex:1" onclick="act.cloudOut()">Sign out</button>
      </div>
      <div class="meta">Signing out uploads your changes, then erases this device's copy.</div>`;
      return `<div class="card col" style="gap:10px;margin-top:16px;border:1px solid #3A2E20" id="cloudcard">
      <div class="section">☁️ CLOUD SYNC</div>
      ${inner}
      ${cloudMsg ? `<div style="font-size:13px">${esc(cloudMsg)}</div>` : ""}
    </div>`;
    }
    function refreshCloudCard() {
      const el = document.getElementById("cloudcard");
      if (el) el.outerHTML = cloudCard();
    }

    // ---- login gate ----
    // Nothing loads or renders until Supabase confirms who you are. The page
    // code is public (it's a website), so the real lock is on the data: every
    // row is readable only by its owner, and sign-ups are closed in the
    // database (supabase-setup.sql). Usernames map to an internal email.
    const USER_DOMAIN = "@syedmudaseer.com";
    let gateMsg = "", gateBusy = false;
    function showGate() {
      document.getElementById("app").innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">
      <form class="raid" style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;text-align:left" onsubmit="event.preventDefault();act.gateIn()">
        <div class="section" style="margin:0">🔒 THE SYSTEM</div>
        <div class="meta">Private. Sign in to continue.</div>
        <input id="gUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Username">
        <input id="gPass" type="password" autocomplete="current-password" placeholder="Password">
        <button class="gold" type="submit" ${gateBusy ? "disabled" : ""}>${gateBusy ? "Signing in…" : "Sign in"}</button>
        ${gateMsg ? `<div style="font-size:13px;color:var(--vermilion)">${esc(gateMsg)}</div>` : ""}
      </form>
    </div>`;
      const u = document.getElementById("gUser"); if (u && !gateBusy) u.focus();
    }
    async function enterApp() {
      if (navigator.onLine && sb) await Promise.race([syncState().catch(() => { }), new Promise(r => setTimeout(r, 4000))]);
      load(); render(); loadWorkTotals();
      if (cloudUser) sync();
    }
    // Erase every trace of the System from this browser.
    async function wipeDevice() {
      [KEY, SYNC_REV, LOG_CURSOR].forEach(k => { try { localStorage.removeItem(k); } catch (e) { } });
      if (db) { try { db.close(); } catch (e) { } db = null; }
      await new Promise(res => { const q = indexedDB.deleteDatabase("lifesys-db"); q.onsuccess = res; q.onerror = res; q.onblocked = res; });
    }
    Object.assign(act, {
      async gateIn() {
        if (gateBusy) return;
        const raw = (document.getElementById("gUser").value || "").trim().toLowerCase();
        const pw = document.getElementById("gPass").value || "";
        if (!raw || !pw) { gateMsg = "Enter your username and password."; showGate(); return; }
        if (!sb) { gateMsg = "Can't reach the login service — check your connection."; showGate(); return; }
        gateBusy = true; gateMsg = ""; showGate();
        const r = await sb.auth.signInWithPassword({ email: raw.includes("@") ? raw : raw + USER_DOMAIN, password: pw });
        gateBusy = false;
        if (r.error) { gateMsg = "Wrong username or password."; showGate(); return; }
        cloudUser = r.data.user;
        document.getElementById("app").innerHTML = "";
        await enterApp();
      },
      async cloudOut() {
        cloudMsg = "Uploading your changes…"; refreshCloudCard();
        clearTimeout(pushTimer); pushTimer = null;
        await sync();
        if (cloudMsg) {   // sync() clears the message only when everything uploaded
          if (!confirm("Your latest changes didn't upload (" + cloudMsg + "). Sign out anyway and lose them on this device?")) { refreshCloudCard(); return; }
        }
        await sb.auth.signOut();
        await wipeDevice();
        location.reload();
      },
      cloudSync() { cloudMsg = "Syncing…"; refreshCloudCard(); sync(); },
    });
    if (sb) {
      sb.auth.onAuthStateChange((ev, session) => {
        cloudUser = session ? session.user : null;
        if (ev === "SIGNED_OUT" && S) location.reload();   // session ended elsewhere: back to the gate
        else if (S) refreshCloudCard();
      });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") sync();
        else if (pushTimer) { clearTimeout(pushTimer); pushTimer = null; sync(); }
      });
      window.addEventListener("online", () => sync());
      setInterval(() => { if (document.visibilityState === "visible") sync(); }, 60000);
    }

    openDB().then(async () => {
      let signedIn = false;
      if (sb) {
        try {
          const { data } = await sb.auth.getSession();
          cloudUser = data.session ? data.session.user : null;
          signedIn = !!cloudUser;
        } catch (e) { }
      } else {
        // login library didn't load (offline): a device that signed in before keeps working locally
        signedIn = !!lsGet("sb-mbncpbuypmtalevnpicq-auth-token");
      }
      if (!signedIn) return showGate();
      await enterApp();
    });
  </script>
